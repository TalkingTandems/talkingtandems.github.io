<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Talking Tandems Route Map</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
html,body{height:100%;margin:0;font-family:Arial,sans-serif}header{background:#155c3b;color:white;padding:12px 18px}
h1{font-size:1.25rem;margin:0}#status{padding:8px 18px;background:#f4f7f4}#map{height:calc(100% - 108px)}
.leaflet-container{background:#e5eee8}a{color:#075b36}
</style></head><body>
<header><h1 id="title">Talking Tandems · Route Map</h1></header>
<div id="status" role="status" aria-live="polite">Loading route…</div><div id="map" aria-label="Interactive route map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map=L.map('map');map.setView([56.08,-3.4],11);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
const params=new URLSearchParams(location.search);
const filename=params.get('gpx')||'Findatie Loch Loop.gpx';
const status=document.getElementById('status');
if(filename.includes('/')||filename.includes('\\')||!filename.toLowerCase().endsWith('.gpx')){
 status.textContent='Invalid GPX filename.';
}else{
 document.getElementById('title').textContent='Talking Tandems · '+filename.replace(/\.gpx$/i,'');
 fetch(filename).then(r=>{if(!r.ok)throw Error('GPX file not found ('+r.status+')');return r.text()})
 .then(s=>{
 const doc=new DOMParser().parseFromString(s,'application/xml');
 if(doc.querySelector('parsererror'))throw Error('Invalid GPX XML');
 let lines=[];
 const tracks=[...doc.getElementsByTagNameNS('*','trkseg')];
 for(const seg of tracks){
 const pts=[...seg.getElementsByTagNameNS('*','trkpt')].map(p=>[+p.getAttribute('lat'),+p.getAttribute('lon')]).filter(p=>p.every(Number.isFinite));
 if(pts.length)lines.push(pts);
 }
 if(!lines.length){
 const pts=[...doc.getElementsByTagNameNS('*','rtept')].map(p=>[+p.getAttribute('lat'),+p.getAttribute('lon')]).filter(p=>p.every(Number.isFinite));
 if(pts.length)lines.push(pts);
 }
 if(!lines.length)throw Error('No track or route points in GPX');
 const all=lines.flat();
 for(const line of lines){
 L.polyline(line,{color:'white',weight:9,opacity:.95}).addTo(map);
 L.polyline(line,{color:'#d6006d',weight:5,opacity:1}).addTo(map);
 }
 L.circleMarker(all[0],{radius:9,color:'white',weight:2,fillColor:'#16803c',fillOpacity:1}).bindPopup('Start').addTo(map);
 L.circleMarker(all[all.length-1],{radius:9,color:'white',weight:2,fillColor:'#1657a1',fillOpacity:1}).bindPopup('Finish').addTo(map);
 map.fitBounds(L.latLngBounds(all),{padding:[30,30]});
 status.textContent='Route loaded · '+all.length+' points · Green = start · Blue = finish';
 }).catch(e=>status.textContent='Could not load route: '+e.message+'. Open this page from GitHub Pages (not directly as a local file).');
}
</script></body></html>
